[project]
name = "capstone-project"
version = "0.1.0"
description = "Minimal FastAPI app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "python-multipart",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "chromadb",
    "pypdf",
    "docx2txt",
    "unstructured",
    "uvicorn[standard]>=0.30.0",
    "langchain-text-splitters>=1.1.1",
    "python-dotenv>=1.2.2",
    "langgraph>=1.1.0",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.11.3",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false
